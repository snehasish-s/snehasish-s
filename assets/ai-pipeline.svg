<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Animated document question answering workflow: upload, extract, embed, retrieve, cite">
<style>.dash{stroke-dasharray:9 13;animation:flow 3.5s linear infinite}@keyframes flow{to{stroke-dashoffset:-88}}.bubble{animation:rise 4s ease-in-out infinite}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.bubble:nth-of-type(2){animation-delay:.4s}.bubble:nth-of-type(3){animation-delay:.8s}.bubble:nth-of-type(4){animation-delay:1.2s}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="300" rx="22" fill="#FCF6EF" stroke="#E0D1C4"/>
<text x="42" y="48" fill="#68454F" font-family="Georgia,serif" font-size="28" font-weight="bold">From documents to trustworthy answers</text>
<text x="43" y="78" fill="#927474" font-family="Arial" font-size="16">A practical retrieval-augmented generation workflow</text>
<path class="dash" d="M116 168 H1080" stroke="#B87569" stroke-width="4" fill="none"/>
<g class="bubble"><rect x="32" y="118" width="196" height="105" rx="19" fill="#F1DAD0" stroke="#D9AB9D"/><circle cx="62" cy="143" r="9" fill="#BA6A5A"/><text x="130" y="167" text-anchor="middle" fill="#503A3E" font-family="Georgia" font-size="25">01 · Upload</text><text x="130" y="194" text-anchor="middle" fill="#846367" font-family="Arial" font-size="16">Documents / PDFs</text></g>
<g class="bubble"><rect x="270" y="118" width="196" height="105" rx="19" fill="#EBDCE2" stroke="#CCB2BE"/><circle cx="300" cy="143" r="9" fill="#8B6076"/><text x="368" y="167" text-anchor="middle" fill="#503A3E" font-family="Georgia" font-size="25">02 · Extract</text><text x="368" y="194" text-anchor="middle" fill="#846367" font-family="Arial" font-size="16">OCR / Chunking</text></g>
<g class="bubble"><rect x="508" y="118" width="196" height="105" rx="19" fill="#F5E4CD" stroke="#E1C6A5"/><circle cx="538" cy="143" r="9" fill="#B8884C"/><text x="606" y="167" text-anchor="middle" fill="#503A3E" font-family="Georgia" font-size="25">03 · Embed</text><text x="606" y="194" text-anchor="middle" fill="#846367" font-family="Arial" font-size="16">Vector store</text></g>
<g class="bubble"><rect x="746" y="118" width="196" height="105" rx="19" fill="#E4E9DF" stroke="#BDCCB8"/><circle cx="776" cy="143" r="9" fill="#638471"/><text x="844" y="167" text-anchor="middle" fill="#503A3E" font-family="Georgia" font-size="25">04 · Search</text><text x="844" y="194" text-anchor="middle" fill="#846367" font-family="Arial" font-size="16">Retrieve context</text></g>
<g class="bubble"><rect x="984" y="118" width="185" height="105" rx="19" fill="#F3D8C4" stroke="#E1B897"/><circle cx="1014" cy="143" r="9" fill="#BA6A5A"/><text x="1075" y="167" text-anchor="middle" fill="#503A3E" font-family="Georgia" font-size="25">05 · Answer</text><text x="1075" y="194" text-anchor="middle" fill="#846367" font-family="Arial" font-size="16">Citations</text></g>
<text x="600" y="269" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="21" fill="#986C61">Curiosity → Engineering → Useful outcomes</text>
</svg>
