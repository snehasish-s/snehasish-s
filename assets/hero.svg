<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Omm Snehasish Parida - Full Stack and Generative AI Developer</title>
<desc id="desc">An animated navy, cyan and lavender developer portfolio banner showing connected artificial intelligence, API, database and cloud nodes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070E1E"/><stop offset=".54" stop-color="#101D38"/><stop offset="1" stop-color="#181B39"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#45E9D1"/><stop offset=".52" stop-color="#4DB7FF"/><stop offset="1" stop-color="#BA8EFF"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152943"/><stop offset="1" stop-color="#111B37"/></linearGradient>
  <pattern id="dots" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7FC9E0" opacity=".12"/></pattern>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="rounded"><rect x="1" y="1" width="1198" height="418" rx="27"/></clipPath>
</defs>
<style>
  .gridflow {animation:shift 9s linear infinite;} @keyframes shift {to {transform:translateX(25px)}}
  .pulse {animation:pulse 2.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes pulse {0%,100%{opacity:.65;transform:scale(.94)}50%{opacity:1;transform:scale(1.07)}}
  .orbit {animation:rotate 26s linear infinite;transform-origin:940px 200px;} @keyframes rotate {to{transform:rotate(360deg)}}
  .orbit2 {animation:rotateback 35s linear infinite;transform-origin:940px 200px;} @keyframes rotateback {to{transform:rotate(-360deg)}}
  .wire {stroke-dasharray:7 10;animation:dash 4s linear infinite;} @keyframes dash {to{stroke-dashoffset:-68}}
  .caret {animation:blink 1.15s steps(1) infinite;} @keyframes blink {50%{opacity:0}}
  .shimmer {animation:shimmer 4s ease-in-out infinite;} @keyframes shimmer {0%,100%{opacity:.45}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce) {* {animation:none!important}}
</style>
<g clip-path="url(#rounded)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect class="gridflow" width="1225" height="420" fill="url(#dots)"/>
  <circle cx="1042" cy="62" r="220" fill="#6556C8" opacity=".055"/>
  <circle cx="1154" cy="315" r="205" fill="#22C7D9" opacity=".04"/>
  <path d="M-4 372H1205" stroke="#3D6782" stroke-opacity=".22"/>
  <rect x="45" y="44" width="291" height="34" rx="17" fill="#1D3450" stroke="#2A6072"/>
  <circle cx="64" cy="61" r="5" fill="#44E8D0" class="pulse"/>
  <text x="79" y="66" fill="#ABDFEA" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">WELCOME TO MY GITHUB</text>
  <text x="46" y="156" fill="#F0F7FF" font-family="DejaVu Sans,Arial,sans-serif" font-size="55" font-weight="800" letter-spacing="-1.2">OMM SNEHASHISH</text>
  <text x="46" y="221" fill="url(#accent)" font-family="DejaVu Sans,Arial,sans-serif" font-size="61" font-weight="800" letter-spacing="1">PARIDA</text>
  <text x="49" y="268" fill="#C1D4E7" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500">Full Stack Engineering  |  Generative AI  |  Cloud</text>
  <rect x="48" y="290" width="635" height="2" rx="1" fill="url(#accent)" opacity=".72"/>
  <rect x="48" y="314" width="610" height="41" rx="9" fill="#101F33" stroke="#3D536B" stroke-opacity=".8"/>
  <text x="67" y="339" fill="#48E6D0" font-family="DejaVu Sans Mono,monospace" font-size="15">$</text>
  <text x="88" y="339" fill="#E5F5FF" font-family="DejaVu Sans Mono,monospace" font-size="14">build(intelligent_systems, end_to_end)</text>
  <rect class="caret" x="525" y="325" width="8" height="17" fill="#45E9D1"/>
  <text x="49" y="394" fill="#8AAAC4" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" letter-spacing="1.3">JAVA + SPRING BOOT  •  REACT + TYPESCRIPT  •  PYTHON + RAG</text>
  <!-- right side: animated network diagram -->
  <circle class="orbit" cx="940" cy="200" r="141" fill="none" stroke="#4BAAC1" stroke-width="1.4" stroke-dasharray="6 13" opacity=".44"/>
  <circle class="orbit2" cx="940" cy="200" r="101" fill="none" stroke="#9B83ED" stroke-width="1.3" stroke-dasharray="3 9" opacity=".48"/>
  <path class="wire" d="M940 200 L829 112 M940 200 L1087 106 M940 200 L820 300 M940 200 L1075 303" stroke="#56CFE1" stroke-width="2" opacity=".75"/>
  <circle cx="940" cy="200" r="67" fill="#0E2039" stroke="url(#accent)" stroke-width="3"/>
  <circle class="pulse" cx="940" cy="200" r="54" fill="#183558" stroke="#66DBC9" stroke-width="1.2" opacity=".8"/>
  <path d="M919 182Q919 174 927 174H953Q961 174 961 182V218Q961 226 953 226H927Q919 226 919 218Z" fill="none" stroke="#75F7E5" stroke-width="2.7"/>
  <path d="M929 192L939 201L929 210 M944 209H952" fill="none" stroke="#75F7E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="940" y="250" text-anchor="middle" fill="#C9F9F0" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">BUILD</text>
  <g>
    <rect x="759" y="82" width="125" height="54" rx="13" fill="url(#panel)" stroke="#42DACC" stroke-opacity=".9"/>
    <circle cx="781" cy="109" r="7" fill="#44E3D2" class="pulse"/>
    <text x="800" y="114" fill="#DCEFFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700">AI / LLM</text>
  </g>
  <g>
    <rect x="1032" y="75" width="127" height="54" rx="13" fill="url(#panel)" stroke="#8F86EF" stroke-opacity=".9"/>
    <circle cx="1053" cy="102" r="7" fill="#A18AF9" class="pulse"/>
    <text x="1072" y="107" fill="#DCEFFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700">API</text>
  </g>
  <g>
    <rect x="754" y="288" width="144" height="54" rx="13" fill="url(#panel)" stroke="#4CBAF5" stroke-opacity=".9"/>
    <circle cx="776" cy="315" r="7" fill="#4DB7FF" class="pulse"/>
    <text x="795" y="320" fill="#DCEFFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="700">DATABASE</text>
  </g>
  <g>
    <rect x="1026" y="284" width="134" height="54" rx="13" fill="url(#panel)" stroke="#85A1FB" stroke-opacity=".9"/>
    <circle cx="1048" cy="311" r="7" fill="#8DA5FF" class="pulse"/>
    <text x="1067" y="316" fill="#DCEFFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700">CLOUD</text>
  </g>
  <circle cx="705" cy="61" r="3" fill="#4EE8D1" class="shimmer"/><circle cx="1148" cy="214" r="3" fill="#B08FFB" class="shimmer"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26" fill="none" stroke="#325A73" stroke-opacity=".56" stroke-width="3"/>
</g>
</svg>
