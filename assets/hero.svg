<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="tit des">
<title id="tit">Omm Snehasish Parida - Full Stack Developer and GenAI Builder</title>
<desc id="des">Animated, warm editorial cover with an orbital sun, orbiting dots and hand-drawn trails</desc>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FFF9F1"/><stop offset="1" stop-color="#F5E9DF"/></linearGradient>
  <linearGradient id="sun" x2="1" y2="1"><stop stop-color="#F8C99D"/><stop offset="1" stop-color="#D57E67"/></linearGradient>
  <pattern id="texture" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#B69886" opacity=".17"/></pattern>
  <clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
</defs>
<style>
.sun {animation: breathe 6s ease-in-out infinite; transform-origin: 924px 205px;}
@keyframes breathe {0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.orbit {animation:orbit 23s linear infinite;transform-origin:924px 205px}
.orbit2 {animation:orbit 37s linear infinite reverse;transform-origin:924px 205px}
@keyframes orbit {to{transform:rotate(360deg)}}
.draw {stroke-dasharray:850;stroke-dashoffset:850;animation:draw 4s ease-out forwards}
@keyframes draw {to{stroke-dashoffset:0}}
.dot{animation:blink 2.8s ease-in-out infinite}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.wave{animation:float 5s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="420" fill="url(#paper)"/><rect width="1200" height="420" fill="url(#texture)"/>
<rect x="20" y="20" width="1160" height="380" rx="18" fill="none" stroke="#DCC6BA" stroke-width="1.4"/>
<path d="M46 82 H670" stroke="#E2C4B5" stroke-width="1"/>
<circle cx="52" cy="49" r="5" fill="#BA6A57"/><text x="68" y="55" fill="#6F4B49" font-family="Georgia,serif" font-size="17" letter-spacing="3">THE DEVELOPER JOURNAL  /  2026</text>
<text x="50" y="145" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#392D32">Omm Snehasish</text>
<text x="50" y="211" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="77" fill="#B85F4D">Parida</text>
<path class="draw" d="M52 224 Q280 248 542 225" fill="none" stroke="#DEA879" stroke-width="4" stroke-linecap="round"/>
<text x="52" y="276" font-family="Arial, sans-serif" font-size="22" fill="#635358">FULL STACK DEVELOPER  ·  AI/GENAI BUILDER</text>
<rect x="50" y="305" width="542" height="50" rx="22" fill="#F1E1D6" stroke="#DBBDAE"/>
<circle cx="72" cy="330" r="6" fill="#698C79" class="dot"/>
<text x="89" y="336" font-family="Arial,sans-serif" font-size="18" fill="#685456">Java / Spring Boot  ·  React  ·  Python  ·  Cloud</text>
<g class="sun"><circle cx="924" cy="205" r="113" fill="url(#sun)" opacity=".85"/><circle cx="924" cy="205" r="91" fill="#F6D5B3" opacity=".72"/><circle cx="924" cy="205" r="54" fill="#FFF6EA" opacity=".95"/><path d="M924 239 C889 213 886 195 899 185 C910 176 921 187 924 195 C929 184 940 178 950 187 C969 205 945 225 924 239 Z" fill="#B7655A" opacity=".85"/></g>
<g class="orbit"><ellipse cx="924" cy="205" rx="180" ry="118" fill="none" stroke="#A97978" stroke-width="2" stroke-dasharray="6 9" opacity=".65"/><circle cx="1104" cy="205" r="12" fill="#A85754"/><circle cx="744" cy="205" r="7" fill="#7B6E87"/></g>
<g class="orbit2"><ellipse cx="924" cy="205" rx="142" ry="155" fill="none" stroke="#E7A77F" stroke-width="2" stroke-dasharray="2 12"/><circle cx="924" cy="49" r="9" fill="#698C79"/></g>
<g class="wave"><path d="M788 342 Q876 316 968 351 T1160 344" fill="none" stroke="#AA766D" stroke-width="3" stroke-linecap="round"/><path d="M828 363 Q922 345 1038 366 T1170 365" fill="none" stroke="#DFB4A0" stroke-width="4" stroke-linecap="round"/></g>
<text x="815" y="398" font-family="Georgia,serif" font-size="14" fill="#866C69" font-style="italic">Human-centered engineering</text>
</g></svg>
