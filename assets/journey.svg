<style>.trace{stroke-dasharray:12 16;animation:trail 6s linear infinite}@keyframes trail{to{stroke-dashoffset:-120}}.n{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.n.two{animation-delay:.7s}.n.three{animation-delay:1.4s}@keyframes pulse{50%{transform:scale(1.18);opacity:.75}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
