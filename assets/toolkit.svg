<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Warm animated cards for frontend, backend, AI and cloud engineering">
<style>.card{animation:lift 5s ease-in-out infinite}.card:nth-of-type(2){animation-delay:.5s}.card:nth-of-type(3){animation-delay:1s}.card:nth-of-type(4){animation-delay:1.5s}@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.flow{stroke-dasharray:8 12;animation:move 5s linear infinite}@keyframes move{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="330" rx="20" fill="#FBF5EE"/>
<path class="flow" d="M230 165 H970" fill="none" stroke="#C38774" stroke-width="3"/>
<g class="card"><rect x="32" y="35" rx="24" width="262" height="258" fill="#F3DFD1" stroke="#DEBCAB"/><circle cx="165" cy="102" r="42" fill="#C66B54"/><text x="165" y="115" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#fff">&lt;/&gt;</text><text x="165" y="185" text-anchor="middle" fill="#3D3035" font-family="Georgia,serif" font-weight="bold" font-size="28">Frontend</text><text x="165" y="220" text-anchor="middle" fill="#785D60" font-family="Arial" font-size="17">React / TypeScript</text><text x="165" y="244" text-anchor="middle" fill="#785D60" font-family="Arial" font-size="17">UI / UX</text></g>
<g class="card"><rect x="322" y="35" rx="24" width="262" height="258" fill="#E9DEE0" stroke="#D2B9C3"/><circle cx="453" cy="102" r="42" fill="#815B70"/><text x="453" y="114" text-anchor="middle" font-family="Georgia,serif" font-size="35" fill="#fff">{ }</text><text x="453" y="185" text-anchor="middle" fill="#3D3035" font-family="Georgia,serif" font-weight="bold" font-size="28">Backend</text><text x="453" y="220" text-anchor="middle" fill="#785D60" font-family="Arial" font-size="17">Java / Spring Boot</text><text x="453" y="244" text-anchor="middle" fill="#785D60" font-family="Arial" font-size="17">APIs / Security</text></g>
<g class="card"><rect x="612" y="35" rx="24" width="262" height="258" fill="#F5E8D5" stroke="#E1C9A4"/><circle cx="743" cy="102" r="42" fill="#BC8955"/><text x="743" y="116" text-anchor="middle" font-family="Georgia,serif" font-size="33" fill="#fff">AI</text><text x="743" y="185" text-anchor="middle" fill="#3D3035" font-family="Georgia,serif" font-weight="bold" font-size="28">Intelligence</text><text x="743" y="220" text-anchor="middle" fill="#785D60" font-family="Arial" font-size="17">RAG / NLP / LLMs</text><text x="743" y="244" text-anchor="middle" fill="#785D60" font-family="Arial" font-size="17">Vector Search</text></g>
<g class="card"><rect x="902" y="35" rx="24" width="262" height="258" fill="#E2EAE3" stroke="#B8CDBE"/><circle cx="1033" cy="102" r="42" fill="#638776"/><text x="1033" y="113" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#fff">CLOUD</text><text x="1033" y="185" text-anchor="middle" fill="#3D3035" font-family="Georgia,serif" font-weight="bold" font-size="28">Cloud</text><text x="1033" y="220" text-anchor="middle" fill="#785D60" font-family="Arial" font-size="17">AWS / Docker</text><text x="1033" y="244" text-anchor="middle" fill="#785D60" font-family="Arial" font-size="17">CI/CD / Deploy</text></g>
</svg>
