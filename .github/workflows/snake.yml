name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVG snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: snehasish-s
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#00CFC8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A78BFA

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
